name: Build RisingOS bramble

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /opt/microsoft /opt/az /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          sudo apt-get clean || true
          echo "After:"
          df -h

      - name: Validate bramble.xml
        run: |
          cat $GITHUB_WORKSPACE/bramble.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$GITHUB_WORKSPACE/bramble.xml'); print('bramble.xml XML OK')"

      - name: Install build packages
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libdw-dev libelf-dev lz4 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3-protobuf
          sudo apt-get clean

      - name: Add swap
        run: |
          echo "Swap before:"
          swapon --show || true
          free -h
          if [ -f /swapfile ]; then
            echo "Swapfile already exists, keeping it"
          else
            sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          echo "Swap after:"
          swapon --show || true
          free -h

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init RisingOS seventeen
        run: |
          mkdir -p ~/rising && cd ~/rising
          git config --global user.email "ojoruwa@github.com"
          git config --global user.name "Ojoruwa"
          repo init -u https://github.com/RisingOS-Revived/android -b seventeen --git-lfs --no-clone-bundle --depth=1

      - name: Add bramble manifest
        run: |
          mkdir -p ~/rising/.repo/local_manifests
          cp $GITHUB_WORKSPACE/bramble.xml ~/rising/.repo/local_manifests/bramble.xml
          cat ~/rising/.repo/local_manifests/bramble.xml

      - name: Sync source
        run: |
          cd ~/rising
          df -h
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync --depth=1 -j4 || repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync --depth=1 -j4
          echo "Sync done"
          df -h
          du -sh ~/rising/* | sort -h || true

      - name: Setup bramble for RisingOS
        run: |
          cp $GITHUB_WORKSPACE/setup_bramble.sh ~/setup_bramble.sh
          chmod +x ~/setup_bramble.sh
          bash ~/setup_bramble.sh

      - name: Build
        run: |
          cd ~/rising
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          df -h
          . build/envsetup.sh
          riseup bramble userdebug
          rise b

      - name: Upload RisingOS zip
        uses: actions/upload-artifact@v4
        with:
          name: RisingOS-bramble-Ojoruwa-Vanilla
          path: |
            /home/runner/rising/out/target/product/bramble/*.zip
            /home/runner/rising/out/target/product/bramble/boot.img
            /home/runner/rising/out/target/product/bramble/dtbo.img
            /home/runner/rising/out/target/product/bramble/vendor_boot.img
            /home/runner/rising/out/target/product/bramble/recovery.img
